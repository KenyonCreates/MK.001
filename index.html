<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>YouTube and Hoodamath Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, Segoe UI, Roboto, Arial, sans-serif;
      margin: 20px;
      background: #f9f9f9;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    #container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      max-width: 900px;
      margin: 0 auto;
    }
    section {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    iframe {
      width: 100%;
      height: 400px;
      border: none;
      border-radius: 8px;
    }
    ul {
      list-style: none;
      padding-left: 0;
    }
    li {
      margin-bottom: 12px;
    }
    a {
      color: #007acc;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>YouTube and Hoodamath Games</h1>
  <div id="container">
    <section>
      <h2>YouTube</h2>
      <!-- Embedding YouTube homepage is blocked by X-Frame-Options, so provide a link -->
      <p>Click below to open YouTube:</p>
      <p><a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer">Go to YouTube.com</a></p>
    </section>
    <section>
      <h2>Hoodamath Games</h2>
      <p>Click any game to play on Hoodamath.com:</p>
      <ul>
        <li><a href="https://hoodamath.com/games/2048" target="_blank" rel="noopener noreferrer">2048</a></li>
        <li><a href="https://hoodamath.com/games/sudoku" target="_blank" rel="noopener noreferrer">Sudoku</a></li>
        <li><a href="https://hoodamath.com/games/minesweeper" target="_blank" rel="noopener noreferrer">Minesweeper</a></li>
        <li><a href="https://hoodamath.com/games/tetris" target="_blank" rel="noopener noreferrer">Tetris</a></li>
        <li><a href="https://hoodamath.com/games/connect4" target="_blank" rel="noopener noreferrer">Connect 4</a></li>
      </ul>
    </section>
  </div>
</body>
</html>
